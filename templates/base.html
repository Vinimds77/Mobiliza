<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block titulo %}Mobiliza{% endblock %}</title>

    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/mobiliza-favicon.svg') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

    @media (max-width: 576px) {

        body { font-size: 1.05rem; }

        h1 { font-size: 1.6rem; }

        h2 { font-size: 1.4rem; }

    }

    </style>

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container-fluid">

        <a class="navbar-brand" href="/">
            <img src="{{ url_for('static', filename='img/mobiliza-logo-navbar.svg') }}" alt="Mobiliza" height="40">
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMobiliza"
            aria-controls="navbarMobiliza"
            aria-expanded="false"
            aria-label="Alternar navegação">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarMobiliza">

            <div class="navbar-nav me-auto">

                <a class="nav-link" href="/">
                    Dashboard
                </a>

                <a class="nav-link" href="/campanhas">
                    Campanhas
                </a>

                <a class="nav-link" href="/contatos">
                    Contatos
                </a>

                <a class="nav-link" href="/segmentos">
                    Segmentos
                </a>

                <a class="nav-link" href="/cliques">
                    Cliques
                </a>

                <a class="nav-link" href="/usuarios">
                    Usuários
                </a>

            </div>

            {% if cliente_atual %}

            <div class="navbar-nav">

                <span class="nav-link text-white-50">
                    Cliente: {{ cliente_atual.nome }}
                </span>

                <a class="nav-link" href="/clientes">
                    Trocar
                </a>

            </div>

            {% endif %}

            <div class="navbar-nav">

                <span class="nav-link text-white-50">
                    {{ current_user.username }}
                </span>

                <a class="nav-link" href="/logout">
                    Sair
                </a>

            </div>

        </div>

    </div>

</nav>

<div class="container mt-4">

{% block conteudo %}

{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
